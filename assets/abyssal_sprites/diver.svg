<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The Diver (player) -- Abyssal Hoard, replaces player_sprite_frames.tres.
       Facing right (+x); flip_h in code handles left-facing, same as today. -->
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="chestGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bff6ff"/>
      <stop offset="55%" stop-color="#35d0c4"/>
      <stop offset="100%" stop-color="#0f6e66" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suitBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#243a47"/>
      <stop offset="100%" stop-color="#121c24"/>
    </linearGradient>
  </defs>

  <!-- trailing bubbles -->
  <circle cx="20" cy="30" r="2.4" fill="#35d0c4" opacity="0.35"/>
  <circle cx="16" cy="40" r="1.6" fill="#35d0c4" opacity="0.3"/>
  <circle cx="24" cy="22" r="1.4" fill="#35d0c4" opacity="0.25"/>

  <!-- hood/head -->
  <path d="M46 18 C58 16 68 24 68 34 C68 42 60 46 52 46 C44 46 40 40 40 32 C40 26 42 20 46 18 Z" fill="url(#suitBody)" stroke="#35d0c4" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- mask slit, glowing eyes -->
  <path d="M50 30 C56 28 62 29 65 33 C62 36 56 37 50 35 Z" fill="#081215"/>
  <ellipse cx="56" cy="32" rx="2.4" ry="1.6" fill="#bff6ff" filter="url(#glow)"/>
  <ellipse cx="61" cy="32.6" rx="1.6" ry="1.2" fill="#bff6ff" filter="url(#glow)"/>

  <!-- torso, tapered wetsuit -->
  <path d="M40 40 C34 46 30 58 34 72 C38 84 52 90 62 84 C70 79 72 66 68 54 C65 46 58 40 50 40 Z" fill="url(#suitBody)" stroke="#1a2b34" stroke-width="1"/>

  <!-- glowing seams down the suit -->
  <path d="M46 46 C42 56 42 68 48 80" fill="none" stroke="#35d0c4" stroke-width="1.1" stroke-opacity="0.55" filter="url(#glow)"/>
  <path d="M58 44 C62 54 62 66 58 78" fill="none" stroke="#35d0c4" stroke-width="1.1" stroke-opacity="0.55" filter="url(#glow)"/>

  <!-- chest core, the strongest glow on the sprite -->
  <circle cx="52" cy="58" r="7.5" fill="url(#chestGlow)" filter="url(#glow)"/>
  <circle cx="52" cy="58" r="3" fill="#eafffb"/>

  <!-- trailing fin/cloak -->
  <path d="M34 60 C24 64 18 74 22 86 C28 82 34 76 38 68 Z" fill="#182832" opacity="0.85"/>

  <!-- arm reaching forward -->
  <path d="M62 52 C70 50 78 52 82 58 C78 60 70 60 64 58 Z" fill="url(#suitBody)" stroke="#1a2b34" stroke-width="0.8"/>
  <circle cx="80" cy="57" r="2.2" fill="#35d0c4" filter="url(#glow)"/>
</svg>
