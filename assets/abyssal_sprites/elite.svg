<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Elite (Tier 3) -- siphonophore/jellyfish, ranged attacker. Fires
       from its glowing core, matching the existing kite-and-shoot
       pattern -- translucent bell, trailing tentacles. -->
  <defs>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bell" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#c7a4e8" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#8a5fb8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#5a3a80" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4e8ff"/>
      <stop offset="60%" stop-color="#c060e6"/>
      <stop offset="100%" stop-color="#c060e6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- trailing tentacles, wavy -->
  <path d="M38 58 C34 70 40 80 34 92" fill="none" stroke="#8a5fb8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M48 60 C46 74 52 82 48 94" fill="none" stroke="#8a5fb8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M58 60 C60 72 54 82 58 92" fill="none" stroke="#8a5fb8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M67 58 C71 70 65 80 70 90" fill="none" stroke="#8a5fb8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- bell dome -->
  <path d="M28 56 C24 34 38 16 54 16 C70 16 82 34 78 56 C68 62 38 62 28 56 Z" fill="url(#bell)" stroke="#c7a4e8" stroke-width="1" stroke-opacity="0.5"/>

  <!-- bell rim frill -->
  <path d="M28 56 C34 60 74 60 78 56" fill="none" stroke="#c7a4e8" stroke-width="1.4" opacity="0.6"/>

  <!-- glowing core, where its shots originate -->
  <circle cx="53" cy="42" r="10" fill="url(#core)" filter="url(#glow)"/>
  <circle cx="53" cy="42" r="3.4" fill="#fbf2ff"/>
</svg>
